version: 2
updates:
  # Workspace pnpm: un PR mensual agrupado por carpeta (raíz, paquete y demo).
  - package-ecosystem: npm
    directories:
      - /
      - /packages/astroblog
      - /examples/demo
    schedule:
      interval: monthly
    groups:
      dependencias:
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
    ignore:
      # astro check (demo) no admite TypeScript 7; los saltos de major se hacen a mano.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests, build y Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Tests (unitarios y de build)
        run: pnpm -r test

      - name: Build del demo
        run: pnpm build:demo

      - name: astro check
        run: pnpm --filter demo exec astro check

      - name: Lighthouse CI
        run: pnpm dlx @lhci/cli@0.15.1 autorun

  release:
    name: Release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm Trusted Publishing (OIDC): sin NPM_TOKEN y con provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Trusted Publishing exige npm >= 11.5.1; Node 22 trae npm 10.
      - name: Actualizar npm
        run: npm install -g npm@latest

      - name: Crear PR de versión o publicar en npm
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
